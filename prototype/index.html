<script>
  /* 主题先于样式生效，避免夜间模式闪白；跟随系统时自动跟随切换 */
  (function(){
    var K = 'detective_theme_v1';
    function apply(){
      var t = null;
      try{ t = localStorage.getItem(K); }catch(e){}
      var dark = t === 'dark' ||
        (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }
    apply();
    try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply); }catch(e){}
    window.Theme = {
      mode(){ try{ return localStorage.getItem(K) || 'auto'; }catch(e){ return 'auto'; } },
      isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; },
      set(mode){
        try{
          if(mode === 'auto') localStorage.removeItem(K);
          else localStorage.setItem(K, mode);
        }catch(e){}
        apply();
        var m = document.querySelector('meta[name="theme-color"]');
        if(m) m.setAttribute('content', this.isDark() ? '#0E2A22' : '#123A2E');
      }
    };
  })();
</script>

<script>
  /* iOS 上键盘弹出时 fixed 输入条会被盖住：用可视视口高度把输入条抬起来 */
  (function(){
    var vv = window.visualViewport;
    if(!vv) return;
    function fit(){
      var gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', gap + 'px');
    }
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    fit();
  })();
  /* 离线可用：https 或本机地址下注册 Service Worker；局域网 http 不支持，直接跳过 */
  (function(){
    if(!('serviceWorker' in navigator)) return;
    var h = location.hostname;
    if(location.protocol !== 'https:' && h !== 'localhost' && h !== '127.0.0.1') return;
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js?v=31').catch(function(){});
    });
    /* 新版本接管后自动刷新一次：孩子不用自己找「刷新」，看到的立刻是新界面 */
    var hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadCtrl) return;
      hadCtrl = false;
      location.reload();
    });
  })();
</script>
